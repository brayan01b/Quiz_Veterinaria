<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">

</head>
<body>


<div class="container">

    <div class="row">
        <div class="col-lg-6 col-md-6 col-ms-6 container justify-content-center card">
            <h3 class="text-center" th:text="${cuerpo}"></h3>
            <div class="card-body">

    <form th:action="@{/guardarCon}" th:object="${Con}" method="post">

        <input type="hidden" th:field="*{codigo}">
       <br>
        <br>
        <select class="form-control"  th:field="*{mascota}">
            <option value="" disabled selected>Seleccione una Mascota</option>
            <option th:each="mascota : ${mascotas}" th:value="${mascota.codigo}" th:text="${mascota.nombre}"></option>
        </select>
        <br>
        <br>
        <select class="form-control"  th:field="*{veterinario}">
            <option value="" disabled selected>Seleccione un Veterinario</option>
            <option th:each="veterinario : ${veterinarios}" th:value="${veterinario.codigo}" th:text="${veterinario.nombre}"></option>
        </select>

        <br>
        <div class="form-group">
            <label>Fecha de consulta</label>
            <input class="form-control" type="text" th:field="*{fecha_consulta}" name="fecha_consulta" required="true" placeholder="Ingrese la fecha de consulta">
        </div>
        <br>
        <div class="form-group">
            <label>Motivo</label>
            <input class="form-control" type="text" th:field="*{motivo}" name="motivo" required="true" placeholder="Ingrese el motivo de la consulta">
        </div>
        <br>
        <br>
        <div class="form-group">
            <label>Diagnostico</label>
            <input class="form-control" type="text" th:field="*{diagnostico}" name="diagnostico" required="true" placeholder="Ingrese el diagnostico">
        </div>
        <br>


        <div>
        <button class="btn btn-success">Guardar</button>
        <a class="btn btn-success" th:href="@{/listarCon}">Regresar</a>
    </div>

    </form>
    </div>
    </div>
    </div>
</div>



</body>
</html>
